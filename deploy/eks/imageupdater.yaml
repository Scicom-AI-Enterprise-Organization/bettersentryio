apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: bettersentryio
  namespace: argocd
spec:
  namespace: argocd
  writeBackConfig:
    method: git
    gitConfig:
      repository: https://github.com/AIES-Infra/infra-dev
      branch: main
      writeBackTarget: kustomization
  applicationRefs:
    - namePattern: bettersentryio
      images:
        - alias: engine
          imageName: 865626945255.dkr.ecr.ap-southeast-5.amazonaws.com/scicom/bettersentryio
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: 'regexp:^v?[0-9]+\.[0-9]+\.[0-9]+.*'
        - alias: web
          imageName: 865626945255.dkr.ecr.ap-southeast-5.amazonaws.com/scicom/bettersentryio-web
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: 'regexp:^v?[0-9]+\.[0-9]+\.[0-9]+.*'
