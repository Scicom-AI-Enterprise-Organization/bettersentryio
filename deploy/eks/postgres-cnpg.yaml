# The same database as a CNPG Cluster — the house pattern (infra-foundation/cnpg-operator).
# Use this *or* postgres-helm-app.yaml, not both.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bettersentryio-pg
  namespace: bettersentryio
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.6
  bootstrap:
    initdb:
      database: bettersentryio
      owner: bettersentryio
      secret:
        name: bettersentryio-pg-app
  storage:
    size: 20Gi
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 256MB
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
# CNPG publishes its own service: bettersentryio-pg-rw.bettersentryio.svc:5432 — the
# SealedSecret's BSIO_DATABASE_URL must point there instead of -postgresql.
